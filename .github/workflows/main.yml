name: Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-child
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Setup Gradle Wrapper
        run: |
          mkdir -p gradle/wrapper
          
          # gradle-wrapper.jar yuklab olish
          curl -sL "https://github.com/gradle/gradle/raw/v8.11.1/gradle/wrapper/gradle-wrapper.jar" \
            -o gradle/wrapper/gradle-wrapper.jar
          
          # gradlew scripti yuklab olish (rasmiy)
          curl -sL "https://github.com/gradle/gradle/raw/v8.11.1/gradlew" \
            -o gradlew
          
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: child-debug-apk
          path: android-child/app/build/outputs/apk/debug/app-debug.apk
