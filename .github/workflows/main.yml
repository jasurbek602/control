name: Android Build

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 4. Android SDK packages
      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

      # 5. Gradle permissions
      - name: Make Gradle executable
        run: chmod +x ./gradlew

      # 6. Clean
      - name: Clean
        run: ./gradlew clean

      # 7. Build Debug APK
      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      # 8. Show APK
      - name: Find APK
        run: |
          echo "===== APK FILES ====="
          find . -type f -name "*.apk" -print

      # 9. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: family-guard-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # 10. Upload build reports if build fails
      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-reports
          path: |
            app/build/reports/
            app/build/outputs/
          if-no-files-found: ignore
