name: Android Build

on:
  push:
    branches:
      - main
      - master

  pull_request:

  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Java 17
      # --------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # --------------------------------------------------
      # 3. Android SDK
      # --------------------------------------------------
      - name: Configure Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          fi

          if [ -d "$ANDROID_HOME/cmdline-tools/16.0/bin" ]; then
            echo "$ANDROID_HOME/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          fi

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      # --------------------------------------------------
      # 4. Find sdkmanager
      # --------------------------------------------------
      - name: Configure sdkmanager
        shell: bash
        run: |
          set -e

          SDKMANAGER=""

          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
              -type f \
              -name sdkmanager \
              -print \
              -quit 2>/dev/null || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          "$SDKMANAGER" --version

      # --------------------------------------------------
      # 5. Android SDK licenses
      # --------------------------------------------------
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses || true

      # --------------------------------------------------
      # 6. Install Android SDK
      # --------------------------------------------------
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # --------------------------------------------------
      # 7. Verify Android SDK
      # --------------------------------------------------
      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          java -version
          "$SDKMANAGER" --version

          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

          echo "Android SDK OK"

      # --------------------------------------------------
      # 8. Check project structure
      # --------------------------------------------------
      - name: Check project structure
        working-directory: android-child
        shell: bash
        run: |
          set -e

          echo "Current directory:"
          pwd

          echo ""
          echo "Project files:"
          find . -maxdepth 3 -type f | sort

          echo ""
          echo "Gradle wrapper directory:"
          if [ -d "gradle/wrapper" ]; then
            ls -la gradle/wrapper
          else
            echo "WARNING: gradle/wrapper directory does not exist"
          fi

      # --------------------------------------------------
      # 9. Install Gradle 9.5.0
      # --------------------------------------------------
      - name: Install Gradle 9.5.0
        shell: bash
        run: |
          set -e

          GRADLE_VERSION="9.5.0"
          GRADLE_DIR="$RUNNER_TEMP/gradle-$GRADLE_VERSION"
          GRADLE_ZIP="$RUNNER_TEMP/gradle-$GRADLE_VERSION-bin.zip"

          if [ ! -x "$GRADLE_DIR/bin/gradle" ]; then
            echo "Downloading Gradle $GRADLE_VERSION..."

            curl -L \
              --fail \
              --retry 3 \
              -o "$GRADLE_ZIP" \
              "https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip"

            rm -rf "$GRADLE_DIR"

            unzip -q "$GRADLE_ZIP" -d "$RUNNER_TEMP"
          fi

          echo "GRADLE_HOME=$GRADLE_DIR" >> "$GITHUB_ENV"
          echo "$GRADLE_DIR/bin" >> "$GITHUB_PATH"

          echo ""
          echo "Gradle version:"
          "$GRADLE_DIR/bin/gradle" --version

      # --------------------------------------------------
      # 10. Repair Gradle Wrapper
      # --------------------------------------------------
      - name: Repair Gradle Wrapper
        working-directory: android-child
        shell: bash
        run: |
          set -e

          echo "Fixing Gradle wrapper..."

          # Fix Windows CRLF
          if [ -f "gradlew" ]; then
            sed -i 's/\r$//' gradlew
            chmod +x gradlew
          fi

          # Create wrapper directory
          mkdir -p gradle/wrapper

          echo ""
          echo "Generating Gradle wrapper 9.5.0..."

          gradle wrapper \
            --gradle-version 9.5.0 \
            --distribution-type bin

          echo ""
          echo "Wrapper files:"
          ls -la gradle/wrapper

          echo ""
          echo "gradlew:"
          ls -l gradlew

          echo ""
          echo "Testing generated wrapper:"
          ./gradlew --version

      # --------------------------------------------------
      # 11. Gradle clean
      # --------------------------------------------------
      - name: Gradle clean
        working-directory: android-child
        shell: bash
        run: |
          set -e

          ./gradlew clean \
            --no-daemon \
            --stacktrace

      # --------------------------------------------------
      # 12. Build Debug APK
      # --------------------------------------------------
      - name: Build Debug APK
        working-directory: android-child
        shell: bash
        run: |
          set -e

          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace

      # --------------------------------------------------
      # 13. Show APK
      # --------------------------------------------------
      - name: Show APK files
        if: always()
        working-directory: android-child
        shell: bash
        run: |
          echo "Generated APK files:"
          find app/build/outputs \
            -type f \
            -name "*.apk" \
            -print 2>/dev/null || true

      # --------------------------------------------------
      # 14. Upload APK
      # --------------------------------------------------
      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: family-guard-debug-apk
          path: android-child/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # --------------------------------------------------
      # 15. Upload build reports
      # --------------------------------------------------
      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-reports
          path: |
            android-child/app/build/reports/**
            android-child/app/build/outputs/logs/**
          if-no-files-found: ignore
