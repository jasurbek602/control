name: Android Build

on:
  push:
    branches:
      - main
      - master

  pull_request:

  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 3. Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 4. Accept Android SDK licenses
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      # 5. Install only required Android SDK packages
      # IMPORTANT:
      # Do NOT use "sdkmanager tools".
      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

      # 6. Make Gradle executable
      - name: Make Gradle executable
        working-directory: android-child
        run: chmod +x gradlew

      # 7. Clean
      - name: Gradle clean
        working-directory: android-child
        run: ./gradlew clean --no-daemon

      # 8. Build Debug APK
      - name: Build Debug APK
        working-directory: android-child
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      # 9. Upload APK
      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: family-guard-debug-apk
          path: android-child/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # 10. Upload mapping/report files if available
      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-reports
          path: |
            android-child/app/build/reports/**
            android-child/app/build/outputs/logs/**
          if-no-files-found: ignore
