name: Android Build

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Family Guard APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: control/android-child

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
          validate-wrappers: false

      - name: Show Gradle version
        run: gradle --version

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: familyguard-debug-apk
          path: control/android-child/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
